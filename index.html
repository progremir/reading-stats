<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141D36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="/owl.png">
<meta name="apple-mobile-web-app-title" content="Readstreak">
<title>Readstreak</title>
<style>
  :root {
    color-scheme: dark;
    /* night blue cloth and cotton floss, as on the landing page */
    --bg: #141D36;
    --surface-1: #1A2546;
    --surface-2: #24325C;
    --text-primary: #F4EBDD;
    --text-secondary: #C9CCD8;
    --text-muted: #8E95AD;
    --series-1: #E0A15E;
    --ink: #1C2A50;
    --stitch: rgba(244, 235, 221, .26);
    --seq-0: #24325C;
    --seq-1: #1D4A8F;
    --seq-2: #2F6CC4;
    --seq-3: #5B95E0;
    --seq-4: #9CC1EE;
    --grid: #2C3A62;
    --serif: ui-serif, "New York", Georgia, serif;
    --nav-h: 58px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text-primary); }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    max-width: 680px; margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);
    overflow-wrap: anywhere; /* long titles, author lists and chapter names wrap instead of widening the page */
  }
  a { color: inherit; text-decoration: none; }
  h1 { font-family: var(--serif); font-size: 32px; font-weight: 600; letter-spacing: -.01em; margin: 8px 0 2px; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
       color: var(--series-1); margin: 28px 0 10px; }
  .sub { color: var(--text-muted); font-size: 13px; }
  .empty { color: var(--text-secondary); margin-top: 40px; font-size: 17px; }

  /* bottom navigation */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: rgba(20,29,54,.92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-top: 1.5px dashed var(--stitch);
    padding-bottom: env(safe-area-inset-bottom);
    display: flex; justify-content: center;
  }
  nav.tabs a {
    flex: 1; max-width: 200px; height: var(--nav-h);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    color: var(--text-muted); font-size: 11px; font-weight: 500;
  }
  nav.tabs a.on { color: var(--series-1); }
  nav.tabs svg { width: 24px; height: 24px; }

  /* home */
  .hero .label { color: var(--text-secondary); font-size: 15px; }
  .hero .big { font-family: var(--serif); font-size: 68px; font-weight: 600; line-height: 1.05; letter-spacing: -.02em;
               font-variant-numeric: tabular-nums; }
  .hero .big small { font-family: -apple-system, system-ui, sans-serif; font-size: 22px; font-weight: 600; color: var(--text-secondary); margin-left: 6px; }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .tile { position: relative; background: var(--surface-1); border-radius: 14px; padding: 16px; }
  .tile .v { font-family: var(--serif); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; color: #F8E4BF; }
  .tile .v small { font-family: -apple-system, system-ui, sans-serif; font-size: 15px; color: var(--text-secondary); font-weight: 600; margin-left: 3px; }
  .tile .k { color: var(--text-secondary); font-size: 14px; margin-top: 2px; }
  .card { background: var(--surface-1); border-radius: 14px; padding: 16px; position: relative; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .axis { fill: var(--text-muted); font-size: 11px; }
  .tip { position: absolute; pointer-events: none; background: var(--surface-2); color: var(--text-primary);
         border-radius: 8px; padding: 6px 10px; font-size: 14px; white-space: nowrap;
         transform: translate(-50%, -110%); opacity: 0; transition: opacity .1s; box-shadow: 0 2px 10px #0008; }
  .tip.on { opacity: 1; }
  .tip b { font-variant-numeric: tabular-nums; }
  .legend { display: flex; align-items: center; gap: 4px; justify-content: flex-end;
            color: var(--text-muted); font-size: 12px; margin-top: 8px; }
  .legend i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
  .seg { display: flex; gap: 6px; margin-bottom: 10px; }
  .seg button { flex: 1; background: var(--surface-2); color: var(--text-secondary); border: 0;
                border-radius: 10px; padding: 9px 0; font: inherit; font-size: 14px; }
  .seg button.on { background: var(--series-1); color: var(--ink); font-weight: 600; }
  .now { display: flex; gap: 14px; align-items: center; }
  .now .cover { width: 72px; flex: none; }
  .now .info { flex: 1; min-width: 0; }
  .t { font-weight: 600; font-size: 16px; line-height: 1.3; }
  .a { color: var(--text-secondary); font-size: 14px; }
  .clamp1, .clamp2, .clamp3 { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; }
  .clamp1 { -webkit-line-clamp: 1; }
  .clamp2 { -webkit-line-clamp: 2; }
  .clamp3 { -webkit-line-clamp: 3; }
  .bar { height: 6px; background: var(--surface-2); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--series-1); border-radius: 3px; }
  .row { display: flex; justify-content: space-between; gap: 10px; color: var(--text-secondary);
         font-size: 14px; margin-top: 6px; font-variant-numeric: tabular-nums; }

  /* covers */
  .cover { position: relative; aspect-ratio: 2 / 3; border-radius: 6px; overflow: hidden;
           background: var(--surface-2); box-shadow: 0 2px 10px #0009; container-type: inline-size; }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cover .ph { position: absolute; inset: 0; padding: 10% 9%; display: flex; flex-direction: column;
               justify-content: space-between; font-family: Georgia, "New York", serif; color: #f4efe6; }
  .cover .ph b { font-weight: 600; font-size: 11cqw; line-height: 1.2; overflow: hidden;
                 display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; }
  .cover .ph b { flex: 0 1 auto; min-height: 0; }
  .cover .ph span { flex: none; font-size: 7.5cqw; opacity: .8; overflow: hidden;
                    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .cover.small .ph span { display: none; }

  /* books */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 22px 14px; }
  .book .t { font-size: 14px; margin-top: 8px; overflow: hidden;
             display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .book .m { color: var(--text-muted); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .book .bar { height: 3px; margin-top: 7px; }
  .back { display: inline-flex; align-items: center; gap: 4px; color: var(--series-1); font-size: 16px;
          padding: 6px 0; }
  .detail-head { display: flex; gap: 16px; align-items: flex-end; margin-top: 8px; }
  .detail-head .cover { width: 112px; flex: none; }
  .detail-head > div:last-child { flex: 1; min-width: 0; }
  .detail-head h1 { font-size: 22px; line-height: 1.25; margin: 0; }
  .detail-head h1.long { font-size: 18px; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
  .facts .tile .v { font-size: 22px; }

  /* highlights */
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .export-btn { flex: none; background: var(--surface-2); color: var(--text-primary); border: 0; border-radius: 999px;
                padding: 7px 16px; font: inherit; font-size: 14px; font-weight: 600; }
  .export-btn:disabled { opacity: .4; }
  .search-row { display: flex; gap: 8px; margin-top: 14px; }
  .search-row .search { flex: 1; min-width: 0; }
  .filter-btn { flex: none; display: inline-flex; align-items: center; gap: 6px; background: var(--surface-1);
                color: var(--text-primary); border: 1px solid var(--grid); border-radius: 12px; padding: 0 14px;
                font: inherit; font-size: 15px; }
  .filter-btn svg { width: 18px; height: 18px; }
  .badge { background: var(--series-1); color: var(--ink); border-radius: 999px; min-width: 20px; height: 20px; padding: 0 6px;
           font-size: 12px; font-weight: 600; display: inline-grid; place-items: center; }
  .chip.active { display: inline-flex; align-items: center; gap: 8px; max-width: 70vw; color: var(--text-primary); }
  .chip.active i { font-style: normal; color: var(--text-muted); }
  .sheet-bg { position: fixed; inset: 0; z-index: 20; background: #000a; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 680px; margin: 0 auto;
           max-height: 85vh; overflow-y: auto; background: var(--surface-1); border-radius: 18px 18px 0 0;
           padding: 18px 16px calc(16px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 24px #000a; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; font-size: 18px; }
  .sheet .link { background: none; border: 0; padding: 4px 0; color: var(--series-1); font: inherit; font-size: 15px; }
  .sheet h3 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
              color: var(--text-muted); margin: 18px 0 8px; }
  .sheet .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .select { width: 100%; background: var(--surface-2); color: var(--text-primary); border: 0; border-radius: 10px;
            padding: 10px 12px; font: inherit; font-size: 16px; }
  .done { position: relative; width: 100%; margin-top: 22px; background: var(--series-1); color: var(--ink); border: 0; border-radius: 999px;
          padding: 13px; font: inherit; font-size: 16px; font-weight: 600; }
  .search { width: 100%; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--grid);
            border-radius: 12px; padding: 11px 14px; font: inherit; font-size: 16px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 10px -16px 4px; padding: 0 16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; background: var(--surface-2); color: var(--text-secondary); border: 0; border-radius: 999px;
          padding: 7px 14px; font: inherit; font-size: 14px; }
  .chip.on { background: var(--series-1); color: var(--ink); font-weight: 600; }
  .group { position: relative; background: var(--surface-1); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
  .group > summary { list-style: none; padding: 12px 14px; display: flex; gap: 12px; align-items: center; cursor: pointer; }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary .cover { width: 36px; flex: none; }
  .group > summary .info { flex: 1; min-width: 0; }
  .group > summary .n { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .chapter { padding: 12px 14px 0; color: var(--text-muted); font-size: 12px; font-weight: 600;
             letter-spacing: .04em; text-transform: uppercase; }
  .hl { border-top: 1px solid var(--grid); padding: 12px 14px; }
  .chapter + .hl { border-top: 0; }
  .hl q { display: block; quotes: none; font-family: var(--serif); font-size: 17px; line-height: 1.5; }
  .hl .note { margin-top: 8px; padding-left: 10px; border-left: 2px solid var(--series-1); color: var(--text-secondary); font-size: 15px; }
  .hl .meta { margin-top: 6px; color: var(--text-muted); font-size: 13px; }
  .hl .meta a { color: var(--text-secondary); }
  mark { background: #E0A15E55; color: inherit; border-radius: 2px; }
  .words { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px; }
  .word { background: var(--surface-2); border-radius: 8px; padding: 6px 10px; font-family: Georgia, "New York", serif;
          font-size: 15px; }
  .quote { position: relative; background: var(--surface-1); border-radius: 14px; padding: 22px; }
  .quote .note { padding-left: 10px; border-left: 2px solid var(--series-1); color: var(--text-secondary); font-size: 15px; }
  .quote q { display: block; quotes: none; font-family: var(--serif); font-size: 20px; line-height: 1.45; }
  .quote .src { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
  .quote .src .cover { width: 30px; flex: none; }
  .quote .src > div { min-width: 0; }

  /* send to e-reader */
  .sheet p { color: var(--text-secondary); font-size: 15px; margin: 8px 0 0; }
  .drop { display: block; margin-top: 16px; border: 1.5px dashed var(--stitch); border-radius: 14px; padding: 26px 14px;
          text-align: center; color: var(--text-secondary); font-size: 15px; cursor: pointer; }
  .drop b { display: block; color: var(--text-primary); font-size: 16px; margin-bottom: 2px; }
  .drop.over { border-color: var(--series-1); background: #E0A15E14; }
  .drop input { display: none; }
  .file { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--grid); }
  .file:first-child { border-top: 0; }
  .file .info { flex: 1; min-width: 0; }
  .file .t { font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .sub.err { color: #e5786d; }
  .file .bar { height: 3px; margin-top: 6px; }
  .file .x { flex: none; background: none; border: 0; color: var(--text-muted); font: inherit; font-size: 22px;
             line-height: 1; padding: 4px 6px; }

  /* stitched details: a running stitch just inside cards and tiles, and on primary buttons */
  .card::before, .tile::before, .quote::before, .group::before {
    content: ""; position: absolute; inset: 5px; border: 1.5px dashed var(--stitch); border-radius: 9px; pointer-events: none; }
  .done::after, .seg button.on::after, .chip.on::after { content: ""; position: absolute; inset: 3px; border-radius: inherit;
    border: 1.5px dashed rgba(28, 42, 80, .45); pointer-events: none; }
  .seg button, .chip { position: relative; }

  /* the 26 week calendar, cross stitched on linen in a wooden frame */
  .hoop { border-radius: 14px; padding: 6px; background: #B9844F; box-shadow: 0 10px 30px #0006, inset 0 0 0 1px #ffffff1f; }
  .hoop .linen { border-radius: 8px; overflow: hidden; background: #EDE3D0; position: relative; }
  .hoop canvas { display: block; width: 100%; }
  .hoop .no-gl { display: none; }
  .hoop + .legend i { border-radius: 2px; }
</style>
</head>
<body>
<main id="view"><div class="empty">Loading…</div></main>
<nav class="tabs">
  <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Today</a>
  <a href="#/books" data-tab="books"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>Books</a>
  <a href="#/highlights" data-tab="highlights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h6M14.5 4.5l5 5L10 19H5v-5z"/></svg>Highlights</a>
  <a href="/account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>Account</a>
</nav>
<script>
let DATA = null;
const state = { bookFilter: "all", hlType: "passages", hlSource: "all", hlBook: "all", hlDate: "any",
                hlGroup: "book", hlQuery: "", filterOpen: false, sendOpen: false };

const fmtDur = s => {
  const m = Math.round(s / 60);
  if (m < 60) return [m, "min"];
  const h = s / 3600;
  return [h >= 10 ? Math.round(h) : h.toFixed(1), "h"];
};
const durText = s => { const [v, u] = fmtDur(s); return v + " " + u; };
const durHTML = s => { const [v, u] = fmtDur(s); return `${v}<small>${u}</small>`; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dayLabel = iso => new Date(iso + "T12:00:00").toLocaleDateString(undefined, {weekday: "short", month: "short", day: "numeric"});
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString(undefined, {year: "numeric", month: "short", day: "numeric"}) : "";
const ago = iso => {
  const d = (Date.now() - new Date(iso)) / 86400000;
  if (d < 1) return "today";
  if (d < 2) return "yesterday";
  if (d < 30) return Math.floor(d) + " days ago";
  return new Date(iso).toLocaleDateString(undefined, {month: "short", day: "numeric", year: d > 300 ? "numeric" : undefined});
};
const pct = p => Math.round(p * 100) + "%";

// Covers: Open Library via the server, or a generated cloth-bound placeholder.
const PH_COLORS = ["#5b3a29", "#2f4858", "#3d5a40", "#6b2d3c", "#33415c", "#5c4d2e", "#4a3557", "#2d5052"];
function hash(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
function cover(b, cls = "") {
  const bg = PH_COLORS[hash(b.title) % PH_COLORS.length];
  return `<div class="cover ${cls}" style="background:${bg}">
    <div class="ph"><b>${esc(b.title)}</b><span>${esc((b.authors || "").split(",")[0])}</span></div>
    <img src="/cover/${b.id}" alt="" loading="lazy" onerror="this.remove()"></div>`;
}

function tipFor(card) {
  const tip = document.createElement("div");
  tip.className = "tip";
  card.appendChild(tip);
  let timer;
  return (x, y, html) => {
    tip.innerHTML = html;
    const w = card.clientWidth, half = tip.offsetWidth / 2 + 4;
    tip.style.left = Math.min(Math.max(x, half), w - half) + "px";
    tip.style.top = y + "px";
    tip.classList.add("on");
    clearTimeout(timer);
    timer = setTimeout(() => tip.classList.remove("on"), 2500);
  };
}

function barChart(card, days, metric) {
  card.querySelectorAll("svg,.tip").forEach(n => n.remove());
  const W = 600, H = 220, padL = 34, padB = 22, padT = 8;
  const vals = days.map(d => metric === "time" ? d.seconds / 60 : d.pages);
  const max = Math.max(...vals, metric === "time" ? 30 : 10);
  const niceStep = metric === "time" ? (max > 180 ? 60 : max > 60 ? 30 : 15) : (max > 200 ? 50 : max > 50 ? 25 : 5);
  const top = Math.ceil(max / niceStep) * niceStep;
  const plotW = W - padL, plotH = H - padB - padT;
  const slot = plotW / days.length, bw = Math.max(2, slot - 2);
  const y = v => padT + plotH - (v / top) * plotH;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Reading per day, last ${days.length} days">`;
  for (let v = 0; v <= top; v += niceStep) {
    s += `<line x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>`;
    s += `<text class="axis" x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${v}${metric === "time" ? "m" : ""}</text>`;
  }
  days.forEach((d, i) => {
    const v = vals[i], x = padL + i * slot + 1, h = (v / top) * plotH;
    if (v > 0) {
      const r = Math.min(4, bw / 2, h);
      const y0 = padT + plotH, y1 = y0 - h;
      s += `<path d="M${x},${y0}V${y1 + r}Q${x},${y1} ${x + r},${y1}H${x + bw - r}Q${x + bw},${y1} ${x + bw},${y1 + r}V${y0}Z" fill="var(--series-1)"/>`;
    }
    s += `<rect data-i="${i}" x="${padL + i * slot}" y="0" width="${slot}" height="${H}" fill="transparent"/>`;
    if (i % 7 === (days.length - 1) % 7)
      s += `<text class="axis" x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${new Date(d.date + "T12:00:00").toLocaleDateString(undefined, {month: "numeric", day: "numeric"})}</text>`;
  });
  s += "</svg>";
  card.insertAdjacentHTML("beforeend", s);
  const svg = card.querySelector("svg"), show = tipFor(card);
  const pick = e => {
    const t = e.target.closest("rect[data-i]");
    if (!t) return;
    const d = days[+t.dataset.i], r = svg.getBoundingClientRect(), cr = card.getBoundingClientRect();
    const px = (padL + (+t.dataset.i + .5) * slot) / W * r.width + r.left - cr.left;
    show(px, r.top - cr.top + y(vals[+t.dataset.i]) / H * r.height,
      `${dayLabel(d.date)} · <b>${durText(d.seconds)}</b> · ${d.pages} pages`);
  };
  svg.addEventListener("pointerdown", pick);
  svg.addEventListener("pointermove", e => e.buttons && pick(e));
}

function heatmap(card, days) {
  const weeks = [];
  const first = new Date(days[0].date + "T12:00:00");
  const lead = (first.getDay() + 6) % 7; // Monday-first rows
  const cells = Array(lead).fill(null).concat(days);
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  const c = 13, g = 2, padL = 18, padT = 14;
  const W = padL + weeks.length * (c + g), H = padT + 7 * (c + g);
  const level = s => s < 60 ? 0 : s < 900 ? 1 : s < 1800 ? 2 : s < 3600 ? 3 : 4;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily reading, last 26 weeks">`;
  ["M", "", "W", "", "F", "", ""].forEach((l, i) =>
    l && (s += `<text class="axis" x="0" y="${padT + i * (c + g) + c - 2}" font-size="9">${l}</text>`));
  let lastMonth = -1;
  weeks.forEach((w, wi) => {
    const firstDay = w.find(Boolean);
    if (firstDay) {
      const m = new Date(firstDay.date + "T12:00:00").getMonth();
      if (m !== lastMonth && wi < weeks.length - 2) {
        s += `<text class="axis" x="${padL + wi * (c + g)}" y="9" font-size="9">${new Date(firstDay.date + "T12:00:00").toLocaleDateString(undefined, {month: "short"})}</text>`;
        lastMonth = m;
      }
    }
    w.forEach((d, di) => {
      if (!d) return;
      s += `<rect data-d="${d.date}" x="${padL + wi * (c + g)}" y="${padT + di * (c + g)}" width="${c}" height="${c}" rx="2" fill="var(--seq-${level(d.seconds)})"/>`;
    });
  });
  s += "</svg>";
  card.insertAdjacentHTML("beforeend", s);
  card.insertAdjacentHTML("beforeend", `<div class="legend">less ${[0,1,2,3,4].map(l => `<i style="background:var(--seq-${l})"></i>`).join("")} more</div>`);
  const svg = card.querySelector("svg"), show = tipFor(card), byDate = Object.fromEntries(days.map(d => [d.date, d]));
  svg.addEventListener("pointerdown", e => {
    const t = e.target.closest("rect[data-d]");
    if (!t) return;
    const d = byDate[t.dataset.d], r = t.getBoundingClientRect(), cr = card.getBoundingClientRect();
    show(r.left + r.width / 2 - cr.left, r.top - cr.top, `${dayLabel(d.date)} · <b>${durText(d.seconds)}</b>`);
  });
}

// One- to three-word highlights are dictionary lookups, not passages.
const isWord = h => h.text.length < 32 && h.text.trim().split(/\s+/).length <= 3;

function wordsHTML(items) {
  return `<div class="words">${items.map(h => `<span class="word">${esc(h.text.trim().replace(/[.,;:!?"“”]+$/, ""))}</span>`).join("")}</div>`;
}

function allHighlights() {
  return DATA.books.flatMap(b => b.highlights.map(h => ({...h, book: b})));
}

// A search matches when every word appears somewhere in the highlight, its note, chapter, book or author.
const searchTerms = q => q.trim().toLowerCase().split(/\s+/).filter(Boolean);
const hlMatches = (h, terms) => {
  const hay = [h.text, h.note, h.chapter, h.book.title, h.book.authors].join("\n").toLowerCase();
  return terms.every(t => hay.includes(t));
};
function mark(text, terms = []) {
  if (!terms.length) return esc(text);
  const re = new RegExp("(" + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  return String(text ?? "").split(re).map((part, i) => i % 2 ? `<mark>${esc(part)}</mark>` : esc(part)).join("");
}

function hlHTML(h, {showBook = false, terms = []} = {}) {
  const meta = [
    showBook ? `<a href="#/book/${h.book.id}">${mark(h.book.title, terms)}</a>` : "",
    !showBook && h.chapter ? "" : (h.chapter ? mark(h.chapter, terms) : ""),
    h.page ? "p. " + h.page : (h.source === "kindle" && h.loc ? "loc. " + h.loc : ""),
    fmtDate(h.datetime),
  ].filter(Boolean).join(" · ");
  return `<div class="hl"><q>${mark(h.text, terms)}</q>
    ${h.note ? `<div class="note">${mark(h.note, terms)}</div>` : ""}
    <div class="meta">${meta}</div></div>`;
}

// Highlights in reading order, split under chapter headings.
function byChapterHTML(items, terms) {
  let out = "", last = null;
  for (const h of items) {
    const ch = h.chapter || (h.source === "kindle" ? "Kindle highlights" : "");
    if (ch !== last) {
      if (ch) out += `<div class="chapter">${mark(ch, terms)}</div>`;
      last = ch;
    }
    out += hlHTML(h, {terms});
  }
  return out;
}

// The 26 weeks as cross stitch on linen, one stitch per day, deeper blue for longer reading.
// One canvas lives across renders: WebGL contexts are costly and browsers cap how many a page holds.
const STITCH_THREADS = ["", "#9CC1EE", "#5B95E0", "#2F6CC4", "#1D4A8F"];
const readLevel = s => s < 60 ? 0 : s < 900 ? 1 : s < 1800 ? 2 : s < 3600 ? 3 : 4;
const stitch = {canvas: document.createElement("canvas"), days: [], lead: 0, weeks: 26, margin: 1};
let stitchReady = null;

function buildSampler(ctx, plot) {
  const {days, lead, margin} = stitch;
  days.forEach((d, i) => {
    const l = readLevel(d.seconds), j = i + lead;
    if (l) plot(ctx, margin + Math.floor(j / 7), margin + j % 7, STITCH_THREADS[l]);
  });
}

async function sampler(hoop, days) {
  const lead = (new Date(days[0].date + "T12:00:00").getDay() + 6) % 7;  // Monday-first rows
  Object.assign(stitch, {days, lead, weeks: Math.ceil((lead + days.length) / 7)});
  const cols = stitch.weeks + 2 * stitch.margin, rows = 7 + 2 * stitch.margin;
  stitchReady ||= import("/embroidery.js").then(({embroider, plot}) => embroider(stitch.canvas, {
    cell: w => w / (stitch.weeks + 2 * stitch.margin), fabric: [237, 227, 208], sweep: 1.4,
    build: ctx => buildSampler(ctx, plot)})).catch(() => null);
  const api = await stitchReady;
  if (!hoop.isConnected) return;
  if (!api) {  // no WebGL: the flat calendar
    hoop.className = "card";
    hoop.innerHTML = "";
    return heatmap(hoop, days);
  }
  stitch.canvas.style.aspectRatio = `${cols} / ${rows}`;
  hoop.querySelector(".linen").appendChild(stitch.canvas);
  api.relayout();
  const show = tipFor(hoop);
  stitch.canvas.onpointerdown = e => {
    const r = stitch.canvas.getBoundingClientRect(), cell = r.width / cols;
    const col = Math.floor((e.clientX - r.left) / cell) - stitch.margin, row = Math.floor((e.clientY - r.top) / cell) - stitch.margin;
    const d = row >= 0 && row < 7 && days[col * 7 + row - lead];
    if (!d) return;
    const hr = hoop.getBoundingClientRect();
    show(r.left + (col + stitch.margin + .5) * cell - hr.left, r.top + (row + stitch.margin) * cell - hr.top,
      `${dayLabel(d.date)} · <b>${durText(d.seconds)}</b>`);
  };
}

// Books sent from here wait on the server until the e-reader's plugin downloads them into its Inbox folder.
const BOOK_TYPES = ["epub", "kepub", "pdf", "djvu", "mobi", "azw", "prc", "fb2", "fbz", "cbz", "xps", "chm", "rtf", "doc", "docx",
                    "txt", "md", "html", "htm", "odt"];
let INBOX = [];
const uploads = [];  // {name, size, loaded, error, done}, newest last
const fmtSize = n => n < 1e6 ? Math.max(1, Math.round(n / 1e3)) + " KB" : (n / 1e6).toFixed(n < 1e7 ? 1 : 0) + " MB";

async function loadInbox() {
  try {
    const r = await fetch("/api/inbox", {cache: "no-store"});
    if (r.ok) INBOX = (await r.json()).books;
  } catch {}
}

function sendBook(file) {
  const up = {name: file.name, size: file.size, loaded: 0};
  uploads.push(up);
  if (!BOOK_TYPES.includes(file.name.split(".").pop().toLowerCase())) {
    up.error = "KOReader can't open this kind of file.";
    return render();
  }
  const xhr = new XMLHttpRequest();
  xhr.open("PUT", "/api/inbox/" + encodeURIComponent(file.name));
  xhr.setRequestHeader("Content-Type", "application/octet-stream");
  xhr.upload.onprogress = e => {
    up.loaded = e.loaded;
    const bar = document.querySelector(`[data-up="${uploads.indexOf(up)}"] .bar > div`);
    if (bar) bar.style.width = pct(e.loaded / (e.total || 1));
  };
  xhr.onload = async () => {
    if (xhr.status === 201) up.done = true;
    else up.error = (() => { try { return JSON.parse(xhr.responseText).error; } catch { return ""; } })()
      || (xhr.status === 413 ? "That file is too large." : "Upload failed (" + xhr.status + ").");
    await loadInbox();
    render();
  };
  xhr.onerror = () => { up.error = "Upload failed. Check your connection."; render(); };
  xhr.send(file);
  render();
}

async function unsend(name) {
  await fetch("/api/inbox/" + encodeURIComponent(name), {method: "DELETE"});

  render();

const HL_TYPES = {
  passages: ["Passages", h => !isWord(h)],
  words: ["Words", isWord],
  notes: ["With notes", h => !!h.note],
};
const HL_SOURCES = {all: "All", koreader: "KOReader", kindle: "Kindle"};
const HL_DEFAULTS = {hlType: "passages", hlSource: "all", hlBook: "all", hlDate: "any"};

function hlDates() {
  const years = [...new Set(allHighlights().map(h => (h.datetime || "").slice(0, 4)).filter(Boolean))].sort().reverse();
  return [["any", "Any time"], ["30d", "Last 30 days"], ...years.map(y => [y, y])];  // pairs: year keys would sort first in an object
}

function inDate(h, date) {
  if (date === "any") return true;
  if (!h.datetime) return false;
  if (date === "30d") return Date.now() - new Date(h.datetime) < 30 * 86400000;
  return h.datetime.startsWith(date);
}

// The highlights the filters and search let through, in the order they're shown.
function filteredHighlights() {
  const terms = searchTerms(state.hlQuery);
  const items = allHighlights().filter(HL_TYPES[state.hlType][1])
    .filter(h => state.hlSource === "all" || h.source === state.hlSource)
    .filter(h => state.hlBook === "all" || h.book.id === state.hlBook)
    .filter(h => inDate(h, state.hlDate))
    .filter(h => hlMatches(h, terms));
  if (state.hlType !== "words" && state.hlGroup === "month")
    items.sort((a, b) => (b.datetime || "").localeCompare(a.datetime || ""));
  return items;
}

// Filters that differ from the defaults, as [state key, label] for the removable chips.
function activeFilters() {
  const book = DATA.books.find(b => b.id === state.hlBook);
  return [
    state.hlType !== "passages" && ["hlType", HL_TYPES[state.hlType][0]],
    state.hlSource !== "all" && ["hlSource", HL_SOURCES[state.hlSource]],
    book && ["hlBook", book.title],
    state.hlDate !== "any" && ["hlDate", (hlDates().find(([v]) => v === state.hlDate) || [, state.hlDate])[1]],
  ].filter(Boolean);
}

      <button class="done" data-close>Show ${count} ${count === 1 ? "highlight" : "highlights"}</button>
    </div>`;

function viewHighlights() {
  const terms = searchTerms(state.hlQuery), q = terms.length > 0;
  const items = filteredHighlights(), active = activeFilters();
  const byBook = () => {
    const groups = new Map();
    for (const h of items) (groups.get(h.book) || groups.set(h.book, []).get(h.book)).push(h);
    return [...groups];
  };
  let body = "";
  if (state.hlType === "words") {
    body = byBook().map(([b, hs]) => `<h2>${esc(b.title)} · ${hs.length}</h2><div class="group">${wordsHTML(hs)}</div>`).join("");
  } else if (state.hlGroup === "book") {
    body = byBook().map(([b, hs], i) => `
      <details class="group"${i === 0 || q || state.hlBook !== "all" ? " open" : ""}>
        <summary>${cover(b, "small")}<div class="info"><div class="t clamp2">${mark(b.title, terms)}</div><div class="a clamp1">${mark(b.authors, terms)}</div></div>
          <span class="n">${hs.length}</span></summary>
        ${byChapterHTML(hs, terms)}
      </details>`).join("");
  } else {
    const groups = new Map();
    for (const h of items) {
      const key = h.datetime ? new Date(h.datetime).toLocaleDateString(undefined, {month: "long", year: "numeric"}) : "Undated";
      (groups.get(key) || groups.set(key, []).get(key)).push(h);
    }
    body = [...groups].map(([month, hs]) => `<h2>${esc(month)} · ${hs.length}</h2>
      <div class="group">${hs.map(h => hlHTML(h, {showBook: true, terms})).join("")}</div>`).join("");
  }
  const total = allHighlights(), nWords = total.filter(isWord).length;
  return `<div class="title-row"><h1>Highlights</h1>
      <button class="export-btn" id="hlexport"${items.length ? "" : " disabled"}>Export</button></div>
    <div class="sub">${total.length - nWords} passages · ${nWords} words · ${DATA.books.filter(b => b.highlights.length).length} books</div>
    <div class="search-row">
      <input class="search" id="hlq" type="search" placeholder="Search" value="${esc(state.hlQuery)}">
      <button class="filter-btn" id="hlfilter" aria-label="Filter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filter${active.length ? `<span class="badge">${active.length}</span>` : ""}</button>
    </div>
    ${active.length ? `<div class="chips">${active.map(([key, label]) =>
      `<button class="chip active" data-clear="${key}"><span class="clamp1">${esc(label)}</span><i>×</i></button>`).join("")}</div>` : ""}
    <div id="hlbody" style="margin-top:14px">${body || `<div class="empty">No highlights match.</div>`}</div>
    ${state.filterOpen ? filterSheetHTML(items.length) : ""}`;
}

// The export is what's on screen: post those highlights and the server turns them into a spreadsheet.
function exportHighlights() {
  const form = document.createElement("form");
  form.method = "post";
  form.action = "/api/highlights.xlsx";
  const field = document.createElement("input");
  field.type = "hidden";
  field.name = "highlights";
  field.value = JSON.stringify(filteredHighlights().map(h => ({
    book: h.book.title, authors: h.book.authors, chapter: h.chapter, page: h.page, loc: h.loc,
    text: h.text, note: h.note, datetime: h.datetime, source: h.source})));
  form.appendChild(field);
  document.body.appendChild(form);
  form.submit();
  form.remove();
}

function mountHighlights() {
  const input = document.getElementById("hlq");
  input.addEventListener("input", () => {
    state.hlQuery = input.value;
    const pos = input.selectionStart;
    render();
    const again = document.getElementById("hlq");
    again.focus();
    again.setSelectionRange(pos, pos);
  });
  const set = changes => { Object.assign(state, changes); render(); };
  document.getElementById("hlexport").addEventListener("click", exportHighlights);
  document.getElementById("hlfilter").addEventListener("click", () => set({filterOpen: true}));
  document.querySelectorAll("[data-clear]").forEach(c => c.addEventListener("click", () =>
    set({[c.dataset.clear]: HL_DEFAULTS[c.dataset.clear]})));
  if (!state.filterOpen) return;
  document.documentElement.style.overflow = "hidden";
  document.querySelectorAll("[data-f]").forEach(c => c.addEventListener("click", () => set({[c.dataset.f]: c.dataset.v})));
  document.getElementById("fbook").addEventListener("change", e => set({hlBook: e.target.value}));
  document.getElementById("freset").addEventListener("click", () => set({...HL_DEFAULTS, hlGroup: "book"}));
  document.querySelectorAll("[data-close]").forEach(c => c.addEventListener("click", () => set({filterOpen: false})));
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && (state.filterOpen || state.sendOpen)) { state.filterOpen = state.sendOpen = false; render(); }
});

// ---------- router ----------

function render() {
  const view = document.getElementById("view");
  const route = location.hash.replace(/^#\/?/, "").split("/");
  let tab = "home";
  if (!DATA) return;
  document.documentElement.style.overflow = "";
  if (route[0] === "books") { tab = "books"; view.innerHTML = viewBooks(); mountBooks(); }
  else if (route[0] === "book") { tab = "books"; view.innerHTML = viewBook(route[1]); }
  else if (route[0] === "highlights") { tab = "highlights"; view.innerHTML = viewHighlights(); mountHighlights(); }
  else { view.innerHTML = viewHome(); mountHome(); }
  document.querySelectorAll("nav.tabs a").forEach(a => a.classList.toggle("on", a.dataset.tab === tab));
}

let lastRoute = location.hash;
window.addEventListener("hashchange", () => {
  state.filterOpen = state.sendOpen = false;
  render();
  if (location.hash !== lastRoute) window.scrollTo(0, 0);
  lastRoute = location.hash;
});

async function load() {
  try {
    const r = await fetch("/api/library", {cache: "no-store"});
    if (r.status === 401) { location.href = "/login"; return; }
    DATA = await r.json();
    await loadInbox();
    render();
  } catch {
    if (!DATA) document.getElementById("view").innerHTML = '<div class="empty">Could not load your reading data.</div>';
  }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
load();
</script>
</body>
</html>
