<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Reading">
<title>Reading</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --surface-1: #1a1a19;
    --surface-2: #262624;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --series-1: #3987e5;
    --seq-0: #2c2c2a;
    --seq-1: #104281;
    --seq-2: #1c5cab;
    --seq-3: #3987e5;
    --seq-4: #86b6ef;
    --grid: #333331;
    --nav-h: 58px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text-primary); }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    max-width: 680px; margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);
  }
  a { color: inherit; text-decoration: none; }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -.01em; margin: 8px 0 2px; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
       color: var(--text-muted); margin: 28px 0 10px; }
  .sub { color: var(--text-muted); font-size: 13px; }
  .empty { color: var(--text-secondary); margin-top: 40px; font-size: 17px; }

  /* bottom navigation */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: rgba(18,18,17,.92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-top: 1px solid var(--grid);
    padding-bottom: env(safe-area-inset-bottom);
    display: flex; justify-content: center;
  }
  nav.tabs a {
    flex: 1; max-width: 200px; height: var(--nav-h);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    color: var(--text-muted); font-size: 11px; font-weight: 500;
  }
  nav.tabs a.on { color: var(--text-primary); }
  nav.tabs svg { width: 24px; height: 24px; }

  /* home */
  .hero .label { color: var(--text-secondary); font-size: 15px; }
  .hero .big { font-size: 64px; font-weight: 700; line-height: 1.05; letter-spacing: -.02em;
               font-variant-numeric: tabular-nums; }
  .hero .big small { font-size: 24px; font-weight: 600; color: var(--text-secondary); margin-left: 4px; }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .tile { background: var(--surface-1); border-radius: 14px; padding: 14px; }
  .tile .v { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .tile .v small { font-size: 15px; color: var(--text-secondary); font-weight: 600; margin-left: 2px; }
  .tile .k { color: var(--text-secondary); font-size: 14px; margin-top: 2px; }
  .card { background: var(--surface-1); border-radius: 14px; padding: 14px; position: relative; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .axis { fill: var(--text-muted); font-size: 11px; }
  .tip { position: absolute; pointer-events: none; background: var(--surface-2); color: var(--text-primary);
         border-radius: 8px; padding: 6px 10px; font-size: 14px; white-space: nowrap;
         transform: translate(-50%, -110%); opacity: 0; transition: opacity .1s; box-shadow: 0 2px 10px #0008; }
  .tip.on { opacity: 1; }
  .tip b { font-variant-numeric: tabular-nums; }
  .legend { display: flex; align-items: center; gap: 4px; justify-content: flex-end;
            color: var(--text-muted); font-size: 12px; margin-top: 8px; }
  .legend i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
  .seg { display: flex; gap: 6px; margin-bottom: 10px; }
  .seg button { flex: 1; background: var(--surface-2); color: var(--text-secondary); border: 0;
                border-radius: 10px; padding: 9px 0; font: inherit; font-size: 14px; }
  .seg button.on { background: var(--text-primary); color: #000; font-weight: 600; }
  .now { display: flex; gap: 14px; align-items: center; }
  .now .cover { width: 72px; flex: none; }
  .now .info { flex: 1; min-width: 0; }
  .t { font-weight: 600; font-size: 16px; line-height: 1.3; }
  .a { color: var(--text-secondary); font-size: 14px; }
  .bar { height: 6px; background: var(--surface-2); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--series-1); border-radius: 3px; }
  .row { display: flex; justify-content: space-between; gap: 10px; color: var(--text-secondary);
         font-size: 14px; margin-top: 6px; font-variant-numeric: tabular-nums; }

  /* covers */
  .cover { position: relative; aspect-ratio: 2 / 3; border-radius: 6px; overflow: hidden;
           background: var(--surface-2); box-shadow: 0 2px 10px #0009; container-type: inline-size; }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cover .ph { position: absolute; inset: 0; padding: 10% 9%; display: flex; flex-direction: column;
               justify-content: space-between; font-family: Georgia, "New York", serif; color: #f4efe6; }
  .cover .ph b { font-weight: 600; font-size: 11cqw; line-height: 1.2; overflow: hidden;
                 display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; }
  .cover .ph span { font-size: 7.5cqw; opacity: .8; }
  .cover.small .ph span { display: none; }

  /* books */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 22px 14px; }
  .book .t { font-size: 14px; margin-top: 8px; overflow: hidden;
             display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .book .m { color: var(--text-muted); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .book .bar { height: 3px; margin-top: 7px; }
  .back { display: inline-flex; align-items: center; gap: 4px; color: var(--series-1); font-size: 16px;
          padding: 6px 0; }
  .detail-head { display: flex; gap: 16px; align-items: flex-end; margin-top: 8px; }
  .detail-head .cover { width: 112px; flex: none; }
  .detail-head h1 { font-size: 22px; line-height: 1.25; margin: 0; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
  .facts .tile .v { font-size: 22px; }

  /* highlights */
  .search { width: 100%; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--grid);
            border-radius: 12px; padding: 11px 14px; font: inherit; font-size: 16px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 10px -16px 4px; padding: 0 16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; background: var(--surface-2); color: var(--text-secondary); border: 0; border-radius: 999px;
          padding: 7px 14px; font: inherit; font-size: 14px; }
  .chip.on { background: var(--text-primary); color: #000; font-weight: 600; }
  .group { background: var(--surface-1); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
  .group > summary { list-style: none; padding: 12px 14px; display: flex; gap: 12px; align-items: center; cursor: pointer; }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary .cover { width: 36px; flex: none; }
  .group > summary .info { flex: 1; min-width: 0; }
  .group > summary .n { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .chapter { padding: 12px 14px 0; color: var(--text-muted); font-size: 12px; font-weight: 600;
             letter-spacing: .04em; text-transform: uppercase; }
  .hl { border-top: 1px solid var(--grid); padding: 12px 14px; }
  .chapter + .hl { border-top: 0; }
  .hl q { display: block; quotes: none; font-family: Georgia, "New York", serif; font-size: 17px; line-height: 1.5; }
  .hl .note { margin-top: 8px; padding-left: 10px; border-left: 2px solid var(--series-1); color: var(--text-secondary); font-size: 15px; }
  .hl .meta { margin-top: 6px; color: var(--text-muted); font-size: 13px; }
  .hl .meta a { color: var(--text-secondary); }
  mark { background: #3987e555; color: inherit; border-radius: 2px; }
  .words { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px; }
  .word { background: var(--surface-2); border-radius: 8px; padding: 6px 10px; font-family: Georgia, "New York", serif;
          font-size: 15px; }
  .quote { background: var(--surface-1); border-radius: 14px; padding: 18px; }
  .quote .note { padding-left: 10px; border-left: 2px solid var(--series-1); color: var(--text-secondary); font-size: 15px; }
  .quote q { display: block; quotes: none; font-family: Georgia, "New York", serif; font-size: 20px; line-height: 1.45; }
  .quote .src { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
  .quote .src .cover { width: 30px; flex: none; }
</style>
</head>
<body>
<main id="view"><div class="empty">Loading…</div></main>
<nav class="tabs">
  <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Today</a>
  <a href="#/books" data-tab="books"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>Books</a>
  <a href="#/highlights" data-tab="highlights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h6M14.5 4.5l5 5L10 19H5v-5z"/></svg>Highlights</a>
  <a href="/account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>Account</a>
</nav>
<script>
let DATA = null;
const state = { bookFilter: "all", hlFilter: "all", hlGroup: "book", hlQuery: "" };

const fmtDur = s => {
  const m = Math.round(s / 60);
  if (m < 60) return [m, "min"];
  const h = s / 3600;
  return [h >= 10 ? Math.round(h) : h.toFixed(1), "h"];
};
const durText = s => { const [v, u] = fmtDur(s); return v + " " + u; };
const durHTML = s => { const [v, u] = fmtDur(s); return `${v}<small>${u}</small>`; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dayLabel = iso => new Date(iso + "T12:00:00").toLocaleDateString(undefined, {weekday: "short", month: "short", day: "numeric"});
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString(undefined, {year: "numeric", month: "short", day: "numeric"}) : "";
const ago = iso => {
  const d = (Date.now() - new Date(iso)) / 86400000;
  if (d < 1) return "today";
  if (d < 2) return "yesterday";
  if (d < 30) return Math.floor(d) + " days ago";
  return new Date(iso).toLocaleDateString(undefined, {month: "short", day: "numeric", year: d > 300 ? "numeric" : undefined});
};
const pct = p => Math.round(p * 100) + "%";

// Covers: Open Library via the server, or a generated cloth-bound placeholder.
const PH_COLORS = ["#5b3a29", "#2f4858", "#3d5a40", "#6b2d3c", "#33415c", "#5c4d2e", "#4a3557", "#2d5052"];
function hash(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
function cover(b, cls = "") {
  const bg = PH_COLORS[hash(b.title) % PH_COLORS.length];
  return `<div class="cover ${cls}" style="background:${bg}">
    <div class="ph"><b>${esc(b.title)}</b><span>${esc((b.authors || "").split(",")[0])}</span></div>
    <img src="/cover/${b.id}" alt="" loading="lazy" onerror="this.remove()"></div>`;
}

function tipFor(card) {
  const tip = document.createElement("div");
  tip.className = "tip";
  card.appendChild(tip);
  let timer;
  return (x, y, html) => {
    tip.innerHTML = html;
    const w = card.clientWidth, half = tip.offsetWidth / 2 + 4;
    tip.style.left = Math.min(Math.max(x, half), w - half) + "px";
    tip.style.top = y + "px";
    tip.classList.add("on");
    clearTimeout(timer);
    timer = setTimeout(() => tip.classList.remove("on"), 2500);
  };
}

function barChart(card, days, metric) {
  card.querySelectorAll("svg,.tip").forEach(n => n.remove());
  const W = 600, H = 220, padL = 34, padB = 22, padT = 8;
  const vals = days.map(d => metric === "time" ? d.seconds / 60 : d.pages);
  const max = Math.max(...vals, metric === "time" ? 30 : 10);
  const niceStep = metric === "time" ? (max > 180 ? 60 : max > 60 ? 30 : 15) : (max > 200 ? 50 : max > 50 ? 25 : 5);
  const top = Math.ceil(max / niceStep) * niceStep;
  const plotW = W - padL, plotH = H - padB - padT;
  const slot = plotW / days.length, bw = Math.max(2, slot - 2);
  const y = v => padT + plotH - (v / top) * plotH;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Reading per day, last ${days.length} days">`;
  for (let v = 0; v <= top; v += niceStep) {
    s += `<line x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>`;
    s += `<text class="axis" x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${v}${metric === "time" ? "m" : ""}</text>`;
  }
  days.forEach((d, i) => {
    const v = vals[i], x = padL + i * slot + 1, h = (v / top) * plotH;
    if (v > 0) {
      const r = Math.min(4, bw / 2, h);
      const y0 = padT + plotH, y1 = y0 - h;
      s += `<path d="M${x},${y0}V${y1 + r}Q${x},${y1} ${x + r},${y1}H${x + bw - r}Q${x + bw},${y1} ${x + bw},${y1 + r}V${y0}Z" fill="var(--series-1)"/>`;
    }
    s += `<rect data-i="${i}" x="${padL + i * slot}" y="0" width="${slot}" height="${H}" fill="transparent"/>`;
    if (i % 7 === (days.length - 1) % 7)
      s += `<text class="axis" x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${new Date(d.date + "T12:00:00").toLocaleDateString(undefined, {month: "numeric", day: "numeric"})}</text>`;
  });
  s += "</svg>";
  card.insertAdjacentHTML("beforeend", s);
  const svg = card.querySelector("svg"), show = tipFor(card);
  const pick = e => {
    const t = e.target.closest("rect[data-i]");
    if (!t) return;
    const d = days[+t.dataset.i], r = svg.getBoundingClientRect(), cr = card.getBoundingClientRect();
    const px = (padL + (+t.dataset.i + .5) * slot) / W * r.width + r.left - cr.left;
    show(px, r.top - cr.top + y(vals[+t.dataset.i]) / H * r.height,
      `${dayLabel(d.date)} · <b>${durText(d.seconds)}</b> · ${d.pages} pages`);
  };
  svg.addEventListener("pointerdown", pick);
  svg.addEventListener("pointermove", e => e.buttons && pick(e));
}

function heatmap(card, days) {
  const weeks = [];
  const first = new Date(days[0].date + "T12:00:00");
  const lead = (first.getDay() + 6) % 7; // Monday-first rows
  const cells = Array(lead).fill(null).concat(days);
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  const c = 13, g = 2, padL = 18, padT = 14;
  const W = padL + weeks.length * (c + g), H = padT + 7 * (c + g);
  const level = s => s < 60 ? 0 : s < 900 ? 1 : s < 1800 ? 2 : s < 3600 ? 3 : 4;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily reading, last 26 weeks">`;
  ["M", "", "W", "", "F", "", ""].forEach((l, i) =>
    l && (s += `<text class="axis" x="0" y="${padT + i * (c + g) + c - 2}" font-size="9">${l}</text>`));
  let lastMonth = -1;
  weeks.forEach((w, wi) => {
    const firstDay = w.find(Boolean);
    if (firstDay) {
      const m = new Date(firstDay.date + "T12:00:00").getMonth();
      if (m !== lastMonth && wi < weeks.length - 2) {
        s += `<text class="axis" x="${padL + wi * (c + g)}" y="9" font-size="9">${new Date(firstDay.date + "T12:00:00").toLocaleDateString(undefined, {month: "short"})}</text>`;
        lastMonth = m;
      }
    }
    w.forEach((d, di) => {
      if (!d) return;
      s += `<rect data-d="${d.date}" x="${padL + wi * (c + g)}" y="${padT + di * (c + g)}" width="${c}" height="${c}" rx="2" fill="var(--seq-${level(d.seconds)})"/>`;
    });
  });
  s += "</svg>";
  card.insertAdjacentHTML("beforeend", s);
  card.insertAdjacentHTML("beforeend", `<div class="legend">less ${[0,1,2,3,4].map(l => `<i style="background:var(--seq-${l})"></i>`).join("")} more</div>`);
  const svg = card.querySelector("svg"), show = tipFor(card), byDate = Object.fromEntries(days.map(d => [d.date, d]));
  svg.addEventListener("pointerdown", e => {
    const t = e.target.closest("rect[data-d]");
    if (!t) return;
    const d = byDate[t.dataset.d], r = t.getBoundingClientRect(), cr = card.getBoundingClientRect();
    show(r.left + r.width / 2 - cr.left, r.top - cr.top, `${dayLabel(d.date)} · <b>${durText(d.seconds)}</b>`);
  });
}

// One- to three-word highlights are dictionary lookups, not passages.
const isWord = h => h.text.length < 32 && h.text.trim().split(/\s+/).length <= 3;

function wordsHTML(items) {
  return `<div class="words">${items.map(h => `<span class="word">${esc(h.text.trim().replace(/[.,;:!?"“”]+$/, ""))}</span>`).join("")}</div>`;
}

function allHighlights() {
  return DATA.books.flatMap(b => b.highlights.map(h => ({...h, book: b})));
}

function hlHTML(h, {showBook = false, query = ""} = {}) {
  const mark = t => {
    const e = esc(t);
    if (!query) return e;
    const q = esc(query).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return e.replace(new RegExp(q, "gi"), m => `<mark>${m}</mark>`);
  };
  const meta = [
    showBook ? `<a href="#/book/${h.book.id}">${esc(h.book.title)}</a>` : "",
    !showBook && h.chapter ? "" : (h.chapter ? esc(h.chapter) : ""),
    h.page ? "p. " + h.page : (h.source === "kindle" && h.loc ? "loc. " + h.loc : ""),
    fmtDate(h.datetime),
  ].filter(Boolean).join(" · ");
  return `<div class="hl"><q>${mark(h.text)}</q>
    ${h.note ? `<div class="note">${mark(h.note)}</div>` : ""}
    <div class="meta">${meta}</div></div>`;
}

// Highlights in reading order, split under chapter headings.
function byChapterHTML(items, query) {
  let out = "", last = null;
  for (const h of items) {
    const ch = h.chapter || (h.source === "kindle" ? "Kindle highlights" : "");
    if (ch !== last) {
      if (ch) out += `<div class="chapter">${esc(ch)}</div>`;
      last = ch;
    }
    out += hlHTML(h, {query});
  }
  return out;
}

// ---------- views ----------

function viewHome() {
  const st = DATA.stats;
  if (st.empty) {
    return `<h1>Reading</h1><div class="empty">No reading stats yet. They appear after the Kindle's first sync.</div>`;
  }
  const reading = DATA.books.find(b => b.last_open && !b.finished && b.seconds > 0);
  const all = allHighlights().filter(h => !isWord(h));
  const today = new Date().toISOString().slice(0, 10);
  const pick = all.length ? all[hash(today) % all.length] : null;
  const [tv, tu] = fmtDur(st.today);
  return `
    <div class="hero">
      <div class="label">Today</div>
      <div class="big">${tv}<small>${tu}</small></div>
      <div class="sub">Synced ${ago(st.updated)} · <a href="/logout" style="color:var(--text-muted)">Sign out</a></div>
    </div>
    ${reading ? `<h2>Currently reading</h2>
    <a class="card now" href="#/book/${reading.id}">
      ${cover(reading)}
      <div class="info">
        <div class="t">${esc(reading.title)}</div>
        <div class="a">${esc(reading.authors)}</div>
        <div class="bar"><div style="width:${pct(reading.progress)}"></div></div>
        <div class="row"><span>${pct(reading.progress)}</span><span>${durText(reading.seconds)} · ${ago(reading.last_open)}</span></div>
      </div>
    </a>` : ""}
    <h2>Overview</h2>
    <div class="tiles">
      <div class="tile"><div class="v">${st.streak}<small>${st.streak === 1 ? "day" : "days"}</small></div><div class="k">Streak · best ${st.best_streak}</div></div>
      <div class="tile"><div class="v">${durHTML(st.week)}</div><div class="k">This week</div></div>
      <div class="tile"><div class="v">${durHTML(st.month)}</div><div class="k">This month</div></div>
      <div class="tile"><div class="v">${durHTML(st.year)}</div><div class="k">This year</div></div>
      <div class="tile"><div class="v">${st.pages_total.toLocaleString()}</div><div class="k">Pages read</div></div>
      <div class="tile"><div class="v">${durHTML(st.total)}</div><div class="k">All time · ${st.days_read} ${st.days_read === 1 ? "day" : "days"}</div></div>
    </div>
    <h2>Last 30 days</h2>
    <div class="seg" id="metric"><button data-m="time" class="on">Time</button><button data-m="pages">Pages</button></div>
    <div class="card" id="bars"></div>
    <h2>26 weeks</h2>
    <div class="card" id="heat"></div>
    ${pick ? `<h2>From your highlights</h2>
    <div class="quote"><q>${esc(pick.text)}</q>
      ${pick.note ? `<div class="note" style="margin-top:12px">${esc(pick.note)}</div>` : ""}
      <a class="src" href="#/book/${pick.book.id}">${cover(pick.book, "small")}
        <div><div class="t" style="font-size:14px">${esc(pick.book.title)}</div><div class="sub">${fmtDate(pick.datetime)}</div></div></a>
    </div>` : ""}`;
}

function mountHome() {
  if (DATA.stats.empty) return;
  const last30 = DATA.stats.days.slice(-30), bars = document.getElementById("bars");
  barChart(bars, last30, "time");
  document.querySelectorAll("#metric button").forEach(btn => btn.addEventListener("click", () => {
    document.querySelectorAll("#metric button").forEach(b => b.classList.toggle("on", b === btn));
    barChart(bars, last30, btn.dataset.m);
  }));
  heatmap(document.getElementById("heat"), DATA.stats.days);
}

const BOOK_FILTERS = {
  all: ["All", () => true],
  reading: ["Reading", b => b.seconds > 0 && !b.finished],
  finished: ["Finished", b => b.finished],
  highlighted: ["Highlighted", b => b.highlights.length > 0],
};

function viewBooks() {
  const [, test] = BOOK_FILTERS[state.bookFilter];
  const books = DATA.books.filter(test);
  return `<h1>Books</h1><div class="sub">${DATA.books.length} books</div>
    <div class="chips" id="bookf">${Object.entries(BOOK_FILTERS).map(([k, [label, t]]) =>
      `<button class="chip ${k === state.bookFilter ? "on" : ""}" data-k="${k}">${label} ${DATA.books.filter(t).length}</button>`).join("")}</div>
    <div class="grid" style="margin-top:16px">${books.map(b => `
      <a class="book" href="#/book/${b.id}">
        ${cover(b)}
        ${b.seconds ? `<div class="bar"><div style="width:${pct(b.progress)}"></div></div>` : ""}
        <div class="t">${esc(b.title)}</div>
        <div class="m">${[b.seconds ? (b.finished ? "Finished" : pct(b.progress)) : "", b.seconds ? durText(b.seconds) : "",
          (n => n ? n + (n === 1 ? " highlight" : " highlights") : "")(b.highlights.filter(h => !isWord(h)).length)].filter(Boolean).join(" · ")}</div>
      </a>`).join("") || `<div class="empty">Nothing here yet.</div>`}</div>`;
}

function mountBooks() {
  document.querySelectorAll("#bookf .chip").forEach(c => c.addEventListener("click", () => {
    state.bookFilter = c.dataset.k;
    render();
  }));
}

function viewBook(id) {
  const b = DATA.books.find(x => x.id === id);
  if (!b) return `<a class="back" href="#/books">‹ Books</a><div class="empty">Book not found.</div>`;
  const notes = b.highlights.filter(h => h.note).length;
  const passages = b.highlights.filter(h => !isWord(h)), words = b.highlights.filter(isWord);
  return `<a class="back" href="#/books">‹ Books</a>
    <div class="detail-head">${cover(b)}
      <div><h1>${esc(b.title)}</h1><div class="a" style="margin-top:4px">${esc(b.authors)}</div></div></div>
    ${b.seconds ? `
    <div class="bar" style="margin-top:18px"><div style="width:${pct(b.progress)}"></div></div>
    <div class="row"><span>${b.finished ? "Finished" : pct(b.progress) + " read"}</span><span>${b.pages_read}/${b.pages || "?"} pages</span></div>
    <div class="facts">
      <div class="tile"><div class="v">${durHTML(b.seconds)}</div><div class="k">Read</div></div>
      <div class="tile"><div class="v">${b.days}</div><div class="k">${b.days === 1 ? "Day" : "Days"}</div></div>
      <div class="tile"><div class="v">${passages.length}</div><div class="k">Highlights</div></div>
    </div>
    <div class="row" style="margin-top:12px"><span>Started ${fmtDate(b.first_read)}</span><span>Last read ${ago(b.last_open)}</span></div>` : ""}
    <h2>Highlights${passages.length ? " · " + passages.length : ""}${notes ? " · " + notes + " notes" : ""}</h2>
    ${passages.length ? `<div class="group">${byChapterHTML(passages)}</div>`
      : `<div class="sub">No highlights in this book yet.</div>`}
    ${words.length ? `<h2>Words · ${words.length}</h2><div class="group">${wordsHTML(words)}</div>` : ""}`;
}

const HL_FILTERS = {
  all: ["Passages", h => !isWord(h)],
  words: ["Words", isWord],
  notes: ["With notes", h => !!h.note],
  koreader: ["KOReader", h => h.source === "koreader"],
  kindle: ["Kindle", h => h.source === "kindle"],
};

function viewHighlights() {
  const q = state.hlQuery.trim().toLowerCase();
  const [, test] = HL_FILTERS[state.hlFilter];
  const items = allHighlights().filter(test)
    .filter(h => !q || (h.text + " " + (h.note || "") + " " + h.book.title).toLowerCase().includes(q));
  let body = "";
  if (state.hlFilter === "words") {
    const groups = new Map();
    for (const h of items) (groups.get(h.book) || groups.set(h.book, []).get(h.book)).push(h);
    body = [...groups].map(([b, hs]) => `<h2>${esc(b.title)} · ${hs.length}</h2><div class="group">${wordsHTML(hs)}</div>`).join("");
  } else if (state.hlGroup === "book") {
    const groups = new Map();
    for (const h of items) (groups.get(h.book) || groups.set(h.book, []).get(h.book)).push(h);
    body = [...groups].map(([b, hs], i) => `
      <details class="group"${i === 0 || q ? " open" : ""}>
        <summary>${cover(b, "small")}<div class="info"><div class="t">${esc(b.title)}</div><div class="a">${esc(b.authors)}</div></div>
          <span class="n">${hs.length}</span></summary>
        ${byChapterHTML(hs, q)}
      </details>`).join("");
  } else {
    const sorted = [...items].sort((a, b) => (b.datetime || "").localeCompare(a.datetime || ""));
    const groups = new Map();
    for (const h of sorted) {
      const key = h.datetime ? new Date(h.datetime).toLocaleDateString(undefined, {month: "long", year: "numeric"}) : "Undated";
      (groups.get(key) || groups.set(key, []).get(key)).push(h);
    }
    body = [...groups].map(([month, hs]) => `<h2>${esc(month)} · ${hs.length}</h2>
      <div class="group">${hs.map(h => hlHTML(h, {showBook: true, query: q})).join("")}</div>`).join("");
  }
  const total = allHighlights(), nWords = total.filter(isWord).length;
  return `<h1>Highlights</h1><div class="sub">${total.length - nWords} passages · ${nWords} words · ${DATA.books.filter(b => b.highlights.length).length} books</div>
    <input class="search" id="hlq" type="search" placeholder="Search highlights" value="${esc(state.hlQuery)}" style="margin-top:14px">
    <div class="chips" id="hlf">${Object.entries(HL_FILTERS).map(([k, [label]]) =>
      `<button class="chip ${k === state.hlFilter ? "on" : ""}" data-k="${k}">${label}</button>`).join("")}</div>
    <div class="seg" id="hlg" style="margin-top:8px">
      <button data-g="book" class="${state.hlGroup === "book" ? "on" : ""}">By book</button>
      <button data-g="month" class="${state.hlGroup === "month" ? "on" : ""}">By month</button></div>
    <div id="hlbody">${body || `<div class="empty">No highlights match.</div>`}</div>`;
}

function mountHighlights() {
  const input = document.getElementById("hlq");
  input.addEventListener("input", () => {
    state.hlQuery = input.value;
    const pos = input.selectionStart;
    render();
    const again = document.getElementById("hlq");
    again.focus();
    again.setSelectionRange(pos, pos);
  });
  document.querySelectorAll("#hlf .chip").forEach(c => c.addEventListener("click", () => { state.hlFilter = c.dataset.k; render(); }));
  document.querySelectorAll("#hlg button").forEach(c => c.addEventListener("click", () => { state.hlGroup = c.dataset.g; render(); }));
}

// ---------- router ----------

function render() {
  const view = document.getElementById("view");
  const route = location.hash.replace(/^#\/?/, "").split("/");
  let tab = "home";
  if (!DATA) return;
  if (route[0] === "books") { tab = "books"; view.innerHTML = viewBooks(); mountBooks(); }
  else if (route[0] === "book") { tab = "books"; view.innerHTML = viewBook(route[1]); }
  else if (route[0] === "highlights") { tab = "highlights"; view.innerHTML = viewHighlights(); mountHighlights(); }
  else { view.innerHTML = viewHome(); mountHome(); }
  document.querySelectorAll("nav.tabs a").forEach(a => a.classList.toggle("on", a.dataset.tab === tab));
}

let lastRoute = location.hash;
window.addEventListener("hashchange", () => {
  render();
  if (location.hash !== lastRoute) window.scrollTo(0, 0);
  lastRoute = location.hash;
});

async function load() {
  try {
    const r = await fetch("/api/library", {cache: "no-store"});
    if (r.status === 401) { location.href = "/login"; return; }
    DATA = await r.json();
    render();
  } catch {
    if (!DATA) document.getElementById("view").innerHTML = '<div class="empty">Could not load your reading data.</div>';
  }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
load();
</script>
</body>
</html>
